[package]
name = "scry-lang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
scry-walker = { path = "../scry-walker" }
scry-store = { path = "../scry-store" }

# tree-sitter core + per-language grammars
tree-sitter = "0.25"
tree-sitter-language = "0.1"
streaming-iterator = "0.1"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-kotlin-ng = "1.1"   # active community grammar, kotlin
tree-sitter-bash = "0.25"        # AOSP build scripts (lunch/mm/mmm) + envsetup.sh

