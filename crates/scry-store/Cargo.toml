[package]
name = "scry-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
scry-walker = { path = "../scry-walker" }

bincode = "1.3"
fst = { version = "0.4", features = ["levenshtein"] }
blake3 = "1"
memmap2 = "0.9"
memchr = { workspace = true }
serde_json = { workspace = true }
# Only used inside the audited unsafe surface (see module-level
# "Unsafe policy"). libc::posix_fadvise lets us hint the page cache
# for grep candidate prefetch — measurable on cold-cache queries.
# Already in the transitive dep tree (memmap2 / jemallocator) so this
# is essentially free.
libc = "0.2"
